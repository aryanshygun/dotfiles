# See this wiki page for more info:
# https://github.com/dylanaraps/neofetch/wiki/Customizing-Info
print_info() {
    prin "\n"

    prin "\n ${cl0}──${cl1}────${cl2}────${cl3}────${cl4}────${cl5}────${cl6}──"
    prin "┌───────────────────────────────┐"
    prin "\n"

    prin "\n \n \n \n \n Usr" "$(whoami)@$(hostname | sed 's/\.local$//')"
    # prin " ​ ​ Date" "$(date '+%a %b %d')"
    # prin " ​ ​ Time" "$(date '+%I %M %p')"
    info " ​ ​ ​ IP" local_ip
    info " ​ ​ ​ OS" distro
    info " ​ ​ ​CPU" cpu
    info " ​ ​ ​Mem" memory
    info " ​ ​ Time" uptime
    info " ​ ​ Term" term
    info " ​ ​ Pckg" packages
    info " ​ ​Shell" shell
    prin "\n"

    # info " ​ ​ Song" song
    # [[ "$player" ]] && prin "​ Player" "$player"

    prin "└───────────────────────────────┘"
    prin "\n ${cl0}──${cl1}────${cl2}────${cl3}────${cl4}────${cl5}────${cl6}──"
}

reset="\033[0m"
red="\033[1;31m"
green="\033[1;32m"
yellow="\033[1;33m"
blue="\033[1;34m"
magenta="\033[1;35m"
cyan="\033[1;36m"
white="\033[1;37m"

separator=" ➜"

cl0="${reset}"
cl1="${red}"
cl2="${green}"
cl3="${yellow}"
cl4="${blue}"
cl5="${magenta}"
cl6="${cyan}"
cl7="${white}"


memory_percent="on"
distro_shorthand="on"
song_format="%artist% | %title%"

